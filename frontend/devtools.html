<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APQ Debugger Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 800px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header {
            margin-bottom: 30px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
            font-weight: 300;
        }

        .content {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            border: 1px solid #e9ecef;
        }

        .status {
            display: inline-block;
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            margin: 10px 0;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .feature {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e9ecef;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .feature:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #667eea;
        }

        .feature-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .feature-desc {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .footer {
            margin-top: 30px;
            color: #888;
            font-size: 0.9rem;
        }

        /* Form Styles */
        .form-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e9ecef;
        }

        .form-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .urlPattern {
            flex: 1;
            min-width: 250px;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s ease;
        }

        .urlPattern:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 90px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .response {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #333;
            word-break: break-word;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 20px;
            }
            
            .logo {
                font-size: 2rem;
            }
            
            .features {
                grid-template-columns: 1fr;
            }

            .form-group {
                flex-direction: column;
                align-items: stretch;
            }

            .urlPattern {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"> APQ Debugger </div>
            <div class="subtitle">Advanced Apollo GraphQL Query Analysis Tool</div>
        </div>

        <div class="content">
            <div class="status" id="debugger-status">🟢 Ready to Start</div>
            <p style="margin: 15px 0; color: #555; line-height: 1.6;">
                Configure URL patterns to intercept and analyze Apollo Client queries for performance optimization.
            </p>
        </div>

        <!-- URL Pattern Form Section -->
        <div class="form-section">
            <div class="form-title">🔗 URL Pattern Configuration</div>
            <form id="myForm">
                <div class="form-group">
                    <input type="text" class="urlPattern" data-pattern-index="1" placeholder="Enter URL pattern to match (e.g., /graphql*, *domain*, etc.)">
                    <button id="add" class="btn btn-secondary" type="button">Add Pattern</button>
                </div>
            </form>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="interception-counter">0</div>
                    <div class="stat-label">Intercepted Requests</div>
                </div>
            </div>

            <div id="form-actions">
                <button id="form-submit" class="btn btn-primary" type="submit">Start Debugging</button>
            </div>
        </div>

        <!-- Response Section -->
        <div id="response-container" style="display: none;">
            <div class="response" id="response"></div>
        </div>

        <!-- <div class="features">
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-title">Query Analytics</div>
                <div class="feature-desc">Monitor query execution times and performance metrics</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔍</div>
                <div class="feature-title">Cache Inspection</div>
                <div class="feature-desc">Explore cached data and identify optimization opportunities</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-title">Performance Insights</div>
                <div class="feature-desc">Get detailed insights into query performance bottlenecks</div>
            </div>
        </div> -->

        <div class="footer">
            <p>APQ Debugger v1.0.0-beta | Built for Apollo Client</p>
        </div>
    </div>

    <script src="../js/devtools.js"></script>
</body>
</html>
