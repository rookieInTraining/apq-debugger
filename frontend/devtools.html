<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APQ Debugger</title>
    <link rel="stylesheet" href="devtools.min.css">
</head>
<body>
    <div class="app">
        <!-- Header Bar -->
        <header class="header">
            <div class="header-left">
                <img src="../icons/icon32.png" alt="APQ" class="header-logo">
                <span class="header-title">APQ Debugger</span>
            </div>
            <div class="header-center">
                <div class="status-badge" id="debugger-status">
                    <span class="status-dot"></span>
                    <span class="status-text">Ready</span>
                </div>
            </div>
            <div class="header-right">
                <span class="request-count" id="request-count">
                    <span class="count-number" id="interception-counter">0</span>
                    <span class="count-label">requests</span>
                </span>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Sidebar - Patterns -->
            <aside class="sidebar" id="patterns-sidebar">
                <div class="sidebar-header">
                    <h2 class="sidebar-title">🔗 Patterns</h2>
                </div>
                <div class="patterns-list" id="patterns-list">
                    <form id="myForm">
                        <div class="pattern-item">
                            <input type="text" class="urlPattern" data-pattern-index="1" placeholder="*graphql*">
                            <button type="button" class="btn-icon btn-remove" title="Remove pattern" style="display: none;">×</button>
                        </div>
                    </form>
                </div>
                <button type="button" class="btn-add-pattern" id="add">
                    <span class="btn-icon-plus">+</span> Add Pattern
                </button>
                <div class="sidebar-actions">
                    <button id="form-submit" class="btn btn-primary btn-block">
                        <span class="btn-icon-play">▶</span> Start
                    </button>
                </div>
            </aside>

            <!-- Center Panel - Request List -->
            <main class="request-panel">
                <div class="panel-header">
                    <h2 class="panel-title">📊 Intercepted Requests</h2>
                    <div class="filter-bar">
                        <input type="text" class="filter-input" id="filter-input" placeholder="Filter by operation name...">
                        <div class="filter-chips">
                            <button class="chip active" data-filter="all">All</button>
                            <button class="chip" data-filter="apq">APQ</button>
                            <button class="chip" data-filter="full">Full</button>
                        </div>
                    </div>
                </div>
                <div class="request-list" id="request-list">
                    <div class="empty-state" id="empty-state">
                        <div class="empty-icon">📡</div>
                        <p class="empty-title">No requests intercepted yet</p>
                        <p class="empty-desc">Add URL patterns and start debugging to capture GraphQL requests</p>
                    </div>
                </div>
            </main>

            <!-- Right Panel - Request Details -->
            <aside class="detail-panel" id="detail-panel">
                <div class="panel-header">
                    <h2 class="panel-title">🔍 Request Details</h2>
                    <button class="btn-icon btn-close" id="close-detail" title="Close">×</button>
                </div>
                <div class="detail-content" id="detail-content">
                    <div class="detail-placeholder">
                        <p>Select a request to view details</p>
                    </div>
                </div>
            </aside>
        </div>

        <!-- Response Container (hidden, for compatibility) -->
        <div id="response-container" style="display: none;">
            <div class="response" id="response"></div>
        </div>
    </div>

    <script src="../js/devtools.min.js"></script>
</body>
</html>
